<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1a1206" />
<title>Lesson Feedback — Guitar App</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #16110a;
    color: #f4ecdd;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  header h1 { font-size: 1.4rem; margin: 8px 0 4px; }
  header p { margin: 0 0 16px; color: #b9ad97; font-size: 0.92rem; }
  .card {
    background: #211910;
    border: 1px solid #3a2c1a;
    border-radius: 14px;
    padding: 18px 16px;
    margin-bottom: 18px;
  }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: 0.95rem; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], textarea {
    width: 100%;
    background: #120d07;
    border: 1px solid #3a2c1a;
    color: #f4ecdd;
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    font-family: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid #f5a623; outline-offset: 0; }
  .hint { color: #8c8068; font-size: 0.78rem; font-weight: 400; margin-left: 6px; }

  /* star rating */
  .stars { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; }
  .stars input { display: none; }
  .stars label {
    margin: 0; font-size: 2rem; line-height: 1; color: #4a3a24; cursor: pointer;
    transition: color 0.12s;
  }
  .stars label:hover, .stars label:hover ~ label,
  .stars input:checked ~ label { color: #f5a623; }

  button.submit {
    margin-top: 18px; width: 100%; padding: 14px;
    background: #f5a623; color: #1a1206; border: none;
    border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
  }
  button.submit:active { transform: translateY(1px); }

  .thanks {
    display: none; background: #1f3a1f; border: 1px solid #3f7a3f;
    color: #d6f5d6; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
    text-align: center; font-weight: 600;
  }
  .thanks.show { display: block; }

  h2 { font-size: 1.1rem; margin: 4px 0 12px; }
  .fb-item {
    background: #120d07; border: 1px solid #2e2316; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .fb-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .fb-who { font-weight: 700; }
  .fb-who.anon { color: #8c8068; font-weight: 500; font-style: italic; }
  .fb-stars { color: #f5a623; white-space: nowrap; }
  .fb-text { white-space: pre-wrap; word-wrap: break-word; }
  .fb-time { color: #8c8068; font-size: 0.74rem; }
  .empty { color: #8c8068; font-size: 0.9rem; }
  a.back {
    display: inline-block; margin-top: 8px; color: #f5a623; text-decoration: none;
    font-weight: 600; font-size: 0.92rem;
  }
  a.back:hover { text-decoration: underline; }
  footer { margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎸 Lesson Feedback</h1>
    <p>Thanks for trying the app! Tell Heidi what was confusing or what you liked. No login, saved right on your phone.</p>
  </header>

  <div id="thanks" class="thanks">Thanks for the feedback! 🙏 Your note is saved below.</div>

  <form id="fb-form" class="card" autocomplete="off">
    <label for="who">Your name <span class="hint">(optional)</span></label>
    <input type="text" id="who" name="who" placeholder="e.g. Sam" maxlength="60" />

    <label>How was the lesson?</label>
    <div class="stars" id="stars">
      <input type="radio" id="s5" name="rating" value="5" /><label for="s5" title="5">★</label>
      <input type="radio" id="s4" name="rating" value="4" /><label for="s4" title="4">★</label>
      <input type="radio" id="s3" name="rating" value="3" /><label for="s3" title="3">★</label>
      <input type="radio" id="s2" name="rating" value="2" /><label for="s2" title="2">★</label>
      <input type="radio" id="s1" name="rating" value="1" /><label for="s1" title="1">★</label>
    </div>

    <label for="text">What was confusing / what you liked</label>
    <textarea id="text" name="text" placeholder="Anything that tripped you up, or that you enjoyed…" maxlength="2000"></textarea>

    <button type="submit" class="submit">Send feedback</button>
  </form>

  <section>
    <h2>Previously submitted</h2>
    <div id="list"></div>
  </section>

  <footer>
    <a class="back" href="index.html?dogfood=1">← Back to the app</a>
  </footer>
</div>

<script src="lib/feedback.js"></script>
<script>
  (function () {
    var form = document.getElementById('fb-form');
    var list = document.getElementById('list');
    var thanks = document.getElementById('thanks');

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtTime(ts) {
      try { return new Date(ts).toLocaleString(); } catch (e) { return ''; }
    }

    function render() {
      var items = (window.GuitarFeedback && window.GuitarFeedback.allFeedback()) || [];
      if (!items.length) {
        list.innerHTML = '<p class="empty">No feedback yet — be the first!</p>';
        return;
      }
      // newest first
      items = items.slice().reverse();
      list.innerHTML = items.map(function (r) {
        var who = r.who && String(r.who).trim()
          ? '<span class="fb-who">' + escapeHtml(r.who) + '</span>'
          : '<span class="fb-who anon">Anonymous</span>';
        var stars = (typeof r.rating === 'number')
          ? '<span class="fb-stars">' + '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating) + '</span>'
          : '';
        var text = r.text ? '<div class="fb-text">' + escapeHtml(r.text) + '</div>' : '';
        var time = r.ts ? '<div class="fb-time">' + escapeHtml(fmtTime(r.ts)) + '</div>' : '';
        return '<div class="fb-item"><div class="fb-meta">' + who + stars + '</div>' + text + time + '</div>';
      }).join('');
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!window.GuitarFeedback) {
        thanks.textContent = 'Storage unavailable in this browser.';
        thanks.classList.add('show');
        return;
      }
      var who = form.who.value.trim();
      var ratingEl = form.querySelector('input[name="rating"]:checked');
      var rating = ratingEl ? parseInt(ratingEl.value, 10) : null;
      var text = form.text.value.trim();

      window.GuitarFeedback.addFeedback({ who: who, rating: rating, text: text });

      thanks.classList.add('show');
      thanks.scrollIntoView({ behavior: 'smooth', block: 'center' });
      form.reset();
      render();
    });

    render();
  })();
</script>
</body>
</html>
