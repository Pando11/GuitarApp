name: Deploy 07-app to GitHub Pages

# One-time owner action: in the repo Settings -> Pages, set "Source" to
# "GitHub Actions". No other setup needed — this workflow publishes 07-app/
# as a static site on every push to main.

on:
  push:
    branches: [main]
    paths:
      - "07-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 07-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
